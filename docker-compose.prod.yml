version: '3.8'

services:
  # API Gateway
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth-service:3001
      - QUEST_SERVICE_URL=http://quest-service:3002
      - PROFILE_SERVICE_URL=http://profile-service:3003
      - GAMIFICATION_SERVICE_URL=http://gamification-service:3004
      - SOCIAL_SERVICE_URL=http://social-service:3005
      - GEOSPATIAL_SERVICE_URL=http://geospatial-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3007
      - PAYMENT_SERVICE_URL=http://payment-service:3008
      - MEDIA_SERVICE_URL=http://media-service:3009
      - ANALYTICS_SERVICE_URL=http://analytics-service:3010
      - ADMIN_SERVICE_URL=http://admin-service:3011
    depends_on:
      - redis
    networks:
      - adventure-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Auth Service
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adventure_auth
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - adventure-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Quest Service
  quest-service:
    build: ./services/quest-service
    container_name: quest-service
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adventure_quests
    depends_on:
      - postgres
    networks:
      - adventure-network
    restart: unless-stopped

  # Profile Service
  profile-service:
    build: ./services/profile-service
    container_name: profile-service
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adventure_profiles
    depends_on:
      - postgres
    networks:
      - adventure-network
    restart: unless-stopped

  # Gamification Service
  gamification-service:
    build: ./services/gamification-service
    container_name: gamification-service
    environment:
      - NODE_ENV=production
      - PORT=3004
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adventure_gamification
    depends_on:
      - postgres
    networks:
      - adventure-network
    restart: unless-stopped

  # Social Service
  social-service:
    build: ./services/social-service
    container_name: social-service
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adventure_social
    depends_on:
      - postgres
    networks:
      - adventure-network
    restart: unless-stopped

  # Media Service
  media-service:
    build: ./services/media-service
    container_name: media-service
    environment:
      - NODE_ENV=production
      - PORT=3009
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=10485760
    volumes:
      - media-uploads:/app/uploads
    networks:
      - adventure-network
    restart: unless-stopped

  # Admin Service
  admin-service:
    build: ./services/admin-service
    container_name: admin-service
    environment:
      - NODE_ENV=production
      - PORT=3011
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adventure_admin
    depends_on:
      - postgres
    networks:
      - adventure-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_MULTIPLE_DATABASES=adventure_auth,adventure_quests,adventure_profiles,adventure_gamification,adventure_social,adventure_admin
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-multiple-databases.sh:/docker-entrypoint-initdb.d/create-multiple-databases.sh
    ports:
      - "5432:5432"
    networks:
      - adventure-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - adventure-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MongoDB (for Geospatial)
  mongodb:
    image: mongo:7-jammy
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=adventure_geospatial
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - adventure-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    environment:
      - REACT_APP_API_URL=http://localhost:3000
    depends_on:
      - api-gateway
    networks:
      - adventure-network
    restart: unless-stopped

  # Admin Dashboard
  admin-dashboard:
    build: ./admin-dashboard
    container_name: admin-dashboard
    ports:
      - "8080:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:3000/api/admin
    depends_on:
      - api-gateway
    networks:
      - adventure-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - adventure-network
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - adventure-network
    restart: unless-stopped

networks:
  adventure-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  media-uploads:
  prometheus-data:
  grafana-data:
