version: '3.8'

services:
  # PostgreSQL - Primary Database
  postgres:
    image: postgres:15-alpine
    container_name: adventure-postgres
    environment:
      POSTGRES_DB: adventure_platform
      POSTGRES_USER: adventure_user
      POSTGRES_PASSWORD: adventure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventure_user -d adventure_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: adventure-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Spatial Data & Flexible Schemas
  mongodb:
    image: mongo:7
    container_name: adventure-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: adventure_user
      MONGO_INITDB_ROOT_PASSWORD: adventure_pass
      MONGO_INITDB_DATABASE: adventure_platform
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Elasticsearch - Search Engine
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: adventure-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # RabbitMQ - Message Queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: adventure-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: adventure_user
      RABBITMQ_DEFAULT_PASS: adventure_pass
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Minio - S3-compatible Object Storage (Development)
  minio:
    image: minio/minio:latest
    container_name: adventure-minio
    environment:
      MINIO_ROOT_USER: adventure_user
      MINIO_ROOT_PASSWORD: adventure_pass
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: adventure-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: adventure-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adventure_pass
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: adventure-jaeger
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: :9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"

  # Mailhog - Email Testing (Development)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: adventure-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

  # Auth Service - Authentication & Authorization
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: adventure-auth-service
    environment:
      NODE_ENV: development
      AUTH_SERVICE_PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: adventure_user
      POSTGRES_PASSWORD: adventure_pass
      POSTGRES_DB: adventure_platform
      POSTGRES_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      BCRYPT_ROUNDS: 12
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      EMAIL_FROM: noreply@adventure-platform.com
      RATE_LIMIT_WINDOW_MS: 3600000
      RATE_LIMIT_MAX: 5
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_MS: 900000
      VERIFICATION_TOKEN_EXPIRY_HOURS: 24
      PASSWORD_RESET_EXPIRY_HOURS: 1
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/v1/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # User Service - User Profile Management
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: adventure-user-service
    environment:
      NODE_ENV: development
      USER_SERVICE_PORT: 3003
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: adventure_user
      POSTGRES_PASSWORD: adventure_pass
      POSTGRES_DB: adventure_platform
      POSTGRES_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 1
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      AUTH_SERVICE_URL: http://auth-service:3001
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: adventure_user
      MINIO_SECRET_KEY: adventure_pass
      MINIO_BUCKET: user-avatars
      MAX_FILE_SIZE: 5242880
      AVATAR_SIZE_SMALL: 50
      AVATAR_SIZE_MEDIUM: 200
      AVATAR_SIZE_LARGE: 400
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3003/api/v1/profiles/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Quest Service - Quest Management & Participation
  quest-service:
    build:
      context: ./services/quest-service
      dockerfile: Dockerfile
    container_name: adventure-quest-service
    environment:
      NODE_ENV: development
      QUEST_SERVICE_PORT: 3004
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: adventure_user
      POSTGRES_PASSWORD: adventure_pass
      POSTGRES_DB: adventure_platform
      POSTGRES_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 2
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      AUTH_SERVICE_URL: http://auth-service:3001
      USER_SERVICE_URL: http://user-service:3003
      MIN_CHECKPOINTS: 3
      MAX_CHECKPOINTS: 50
      DEFAULT_CHECKPOINT_RADIUS: 50
      MAX_QUEST_DISTANCE_KM: 100
      DEFAULT_SEARCH_RADIUS_KM: 50
      MAX_SEARCH_RADIUS_KM: 500
      MAX_FILE_SIZE: 10485760
      ALLOWED_IMAGE_TYPES: image/jpeg,image/png,image/gif,image/webp
      LOG_LEVEL: info
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # Gamification Service - XP, Achievements, Leaderboards, Challenges
  gamification-service:
    build:
      context: ./services/gamification-service
      dockerfile: Dockerfile
    container_name: adventure-gamification-service
    environment:
      NODE_ENV: development
      GAMIFICATION_SERVICE_PORT: 3005
      SERVICE_NAME: gamification-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: adventure_user
      POSTGRES_PASSWORD: adventure_pass
      POSTGRES_DB: adventure_platform
      POSTGRES_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 3
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      AUTH_SERVICE_URL: http://auth-service:3001
      QUEST_SERVICE_URL: http://quest-service:3004
      USER_SERVICE_URL: http://user-service:3003
      # XP System Configuration
      XP_CHECKPOINT_EASY: 50
      XP_CHECKPOINT_MEDIUM: 100
      XP_CHECKPOINT_HARD: 200
      XP_CHECKPOINT_EXPERT: 400
      XP_QUEST_EASY: 500
      XP_QUEST_MEDIUM: 1000
      XP_QUEST_HARD: 2000
      XP_QUEST_EXPERT: 4000
      XP_DAILY_LOGIN: 50
      XP_FIRST_QUEST_DAILY: 200
      XP_SOCIAL_SHARE: 25
      XP_PHOTO_UPLOAD: 10
      XP_QUEST_REVIEW: 50
      XP_FRIEND_REFERRAL: 1000
      # XP Bonuses
      XP_PERFECT_COMPLETION_BONUS: 25
      XP_SPEED_COMPLETION_BONUS: 15
      XP_FIRST_COMPLETION_BONUS: 50
      XP_WEEKEND_BONUS: 10
      # Level Configuration
      LEVEL_BASE_XP: 1000
      LEVEL_GROWTH_RATE: 1.15
      MAX_LEVEL: 100
      # Achievement Configuration
      ACHIEVEMENT_XP_REWARD: 100
      # Leaderboard Configuration
      LEADERBOARD_PAGE_SIZE: 50
      LEADERBOARD_CACHE_TTL: 300
      LEADERBOARD_TOP_N: 100
      # Challenge Configuration
      CHALLENGE_RESET_HOUR: 0
      CHALLENGE_XP_MULTIPLIER: 1.5
      # Streak Configuration
      STREAK_GRACE_PERIOD_HOURS: 6
      STREAK_MAX_FREEZE_COUNT: 3
      STREAK_XP_PER_DAY: 50
      # Seeding
      SEED_GAMIFICATION_DATA: "true"
      # Logging
      LOG_LEVEL: info
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      quest-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3005/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  elasticsearch_data:
  rabbitmq_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: adventure-network
    driver: bridge
