global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'adventure-platform'
    environment: 'production'

scrape_configs:
  # API Gateway
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Auth Service
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:3001']
    metrics_path: '/health'
    scrape_interval: 30s

  # Quest Service
  - job_name: 'quest-service'
    static_configs:
      - targets: ['quest-service:3002']
    metrics_path: '/health'
    scrape_interval: 30s

  # Profile Service
  - job_name: 'profile-service'
    static_configs:
      - targets: ['profile-service:3003']
    metrics_path: '/health'
    scrape_interval: 30s

  # Gamification Service
  - job_name: 'gamification-service'
    static_configs:
      - targets: ['gamification-service:3004']
    metrics_path: '/health'
    scrape_interval: 30s

  # Social Service
  - job_name: 'social-service'
    static_configs:
      - targets: ['social-service:3005']
    metrics_path: '/health'
    scrape_interval: 30s

  # Media Service
  - job_name: 'media-service'
    static_configs:
      - targets: ['media-service:3009']
    metrics_path: '/health'
    scrape_interval: 30s

  # Admin Service
  - job_name: 'admin-service'
    static_configs:
      - targets: ['admin-service:3011']
    metrics_path: '/health'
    scrape_interval: 30s

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # MongoDB Exporter
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb:27017']
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  # - "alerts.yml"
